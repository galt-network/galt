name: Build and deploy

on:
  push:
    branches: [master, production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: target
        run: |
          if [ "$GITHUB_REF_NAME" = production ]; then
            echo "tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.target.outputs.tag }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Self-hosted runner on apps-vm: the Coolify dashboard/API is allowlisted on
  # the VPS, so the deploy call stays on loopback. See infra `gh_runner` role.
  deploy:
    needs: image
    runs-on: [self-hosted, apps]
    if: vars.COOLIFY_URL != ''
    steps:
      - name: Deploy on Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          STAGING_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
          PRODUCTION_UUID: ${{ vars.COOLIFY_PRODUCTION_APP_UUID }}
        run: |
          if [ "$GITHUB_REF_NAME" = production ]; then
            app_uuid="$PRODUCTION_UUID"
          else
            app_uuid="$STAGING_UUID"
          fi
          if [ -z "$app_uuid" ]; then
            echo "::error::Set COOLIFY_STAGING_APP_UUID / COOLIFY_PRODUCTION_APP_UUID repository variables."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            "$COOLIFY_URL/api/v1/deploy?uuid=$app_uuid&force=false" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN"
